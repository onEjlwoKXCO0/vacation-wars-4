# One-click deploy on Render (Dashboard → New → Blueprint → pick this repository).
# Free plan: the server sleeps after 15 min without visitors and wakes in about a minute.
# Saved games: add the two UPSTASH_* values (free Upstash Redis) so crews survive sleeps and redeploys.
services:
  - type: web
    name: vacation-wars-4
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
