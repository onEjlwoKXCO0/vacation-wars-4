# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create vw4_data --size 1 --region cdg`, then `fly deploy`.
# Change "app" to a name of your own (it becomes https://<app>.fly.dev).
app = "vacation-wars-4"
primary_region = "cdg"

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[[mounts]]
  source = "vw4_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
